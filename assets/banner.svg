<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Header Tag Gradient -->
    <linearGradient id="tagGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Pulsing Glows -->
    <radialGradient id="glowPulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="cyanPulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <!-- Backward-compatible SVG 1.1 Drop Shadow -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" />
      <feOffset dx="0" dy="4" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.1); }
      }
      @keyframes floatCard1 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes floatCard2 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(8px); }
      }
      @keyframes waveBar1 {
        0%, 100% { height: 10px; y: 298px; }
        50% { height: 26px; y: 282px; }
      }
      @keyframes waveBar2 {
        0%, 100% { height: 24px; y: 284px; }
        50% { height: 8px; y: 300px; }
      }
      @keyframes waveBar3 {
        0%, 100% { height: 16px; y: 292px; }
        50% { height: 30px; y: 278px; }
      }
      @keyframes signalStream {
        0% { stroke-dashoffset: 160; }
        100% { stroke-dashoffset: 0; }
      }

      .pulse-orb {
        animation: pulseGlow 5s ease-in-out infinite alternate;
        transform-origin: center;
      }
      .float-1 {
        animation: floatCard1 6s ease-in-out infinite;
      }
      .float-2 {
        animation: floatCard2 7s ease-in-out infinite;
      }
      .wb-1 { animation: waveBar1 1.1s ease-in-out infinite; }
      .wb-2 { animation: waveBar2 1.4s ease-in-out infinite; }
      .wb-3 { animation: waveBar3 1.2s ease-in-out infinite 0.2s; }
      .wb-4 { animation: waveBar1 1.5s ease-in-out infinite 0.3s; }
      .wb-5 { animation: waveBar2 1.0s ease-in-out infinite 0.1s; }
      .stream-line {
        stroke-dasharray: 8 10;
        animation: signalStream 3s linear infinite;
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 38px;
        font-weight: 800;
        fill: #ffffff;
      }
      .sub-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 16px;
        font-weight: 500;
        fill: #93c5fd;
      }
      .tag-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 1.5px;
        fill: #a5f3fc;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 13px;
        font-weight: 600;
        fill: #e2e8f0;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 13px;
        font-weight: 600;
        fill: #cbd5e1;
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Network Grid Background -->
  <g stroke="#334155" stroke-width="0.5" opacity="0.2">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Ambient Dynamic Pulsing Orbs -->
  <circle cx="180" cy="90" r="150" fill="url(#glowPulse)" class="pulse-orb" />
  <circle cx="1040" cy="270" r="170" fill="url(#cyanPulse)" class="pulse-orb" />

  <!-- Animated WebRTC Signal Lines -->
  <g opacity="0.35">
    <path class="stream-line" d="M 60 70 Q 300 20 600 70 T 1140 60" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path class="stream-line" d="M 80 290 Q 400 340 700 290 T 1120 280" fill="none" stroke="#a855f7" stroke-width="2" style="animation-duration: 4.5s;" />
  </g>

  <!-- Dynamic Floating Decorative Tech Badges (Sides only) -->
  <g class="float-1" filter="url(#dropShadow)">
    <!-- Top-Right: WebRTC Live Stream -->
    <rect x="910" y="44" width="230" height="42" rx="21" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="932" cy="65" r="5" fill="#10b981" />
    <circle cx="932" cy="65" r="9" fill="#10b981" opacity="0.3" class="pulse-orb" />
    <text x="948" y="70" class="badge-text">WebRTC • Ultra-Low Latency</text>
  </g>

  <g class="float-2" filter="url(#dropShadow)">
    <!-- Bottom-Left: Equalizer Soundwaves Card -->
    <rect x="60" y="270" width="220" height="50" rx="12" fill="url(#cardGrad)" stroke="#6366f1" stroke-width="1.2" />
    <text x="80" y="300" class="badge-text">Audio/Video Mesh</text>
    <!-- Equalizer bars -->
    <rect class="wb-1" x="206" y="292" width="4" height="16" rx="2" fill="#38bdf8" />
    <rect class="wb-2" x="216" y="284" width="4" height="24" rx="2" fill="#818cf8" />
    <rect class="wb-3" x="226" y="288" width="4" height="20" rx="2" fill="#a855f7" />
    <rect class="wb-4" x="236" y="294" width="4" height="14" rx="2" fill="#c084fc" />
    <rect class="wb-5" x="246" y="286" width="4" height="22" rx="2" fill="#38bdf8" />
  </g>

  <g class="float-1" filter="url(#dropShadow)">
    <!-- Bottom-Right: LMS & Pedagogy Card -->
    <rect x="910" y="274" width="230" height="42" rx="21" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1.2" />
    <!-- Graduation Cap icon vector -->
    <path d="M 930 293 L 941 287 L 952 293 L 941 299 Z" fill="#c084fc" />
    <path d="M 935 296 L 935 303 C 935 306 947 306 947 303 L 947 296" fill="none" stroke="#c084fc" stroke-width="1.5" />
    <path d="M 950 293 L 950 304" stroke="#c084fc" stroke-width="1.5" />
    <text x="960" y="300" class="badge-text">LMS &amp; Virtual Classroom</text>
  </g>

  <!-- FOREGROUND LAYER: Always crisp, high-contrast, fully visible -->
  <g id="foreground">
    <!-- Header Topic Tag -->
    <g transform="translate(600, 78)">
      <rect x="-140" y="-16" width="280" height="32" rx="16" fill="url(#tagGrad)" stroke="#818cf8" stroke-width="1" />
      <text x="0" y="5" text-anchor="middle" class="tag-text">CURATED ECOSYSTEM DIRECTORY</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="150" text-anchor="middle" class="title-text">
      Awesome Web Conferencing &amp; Virtual Classroom
    </text>

    <!-- Subtitle -->
    <text x="600" y="194" text-anchor="middle" class="sub-text">
      Self-Hosted Pedagogy Tools, Scalable WebRTC Engines, SFU/MCU Servers &amp; Enterprise SaaS
    </text>

    <!-- Center Feature Highlight Pill -->
    <g transform="translate(600, 240)">
      <rect x="-280" y="-16" width="560" height="32" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="0" y="5" text-anchor="middle" class="pill-text">
        HD Video &amp; Screen Sharing   •   Whiteboards &amp; Breakouts   •   100% Self-Hostable
      </text>
    </g>
  </g>
</svg>
